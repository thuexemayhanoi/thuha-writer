name: ThuHa one-time WordPress credentials check
on:
  push:
    paths:
      - '.github/workflows/thuha-credentials-check-once.yml'
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      PYTHONPATH: src
      THUHA_GITHUB_TOKEN: ${{ github.token }}
      THUHA_WP_USER: ${{ secrets.THUHA_WP_USER }}
      THUHA_WP_APPLICATION_PASSWORD: ${{ secrets.THUHA_WP_APPLICATION_PASSWORD }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          persist-credentials: false
      - name: Check presence only; never log any secret
        shell: bash
        run: |
          set -euo pipefail
          python3 -m thuha.cli credentials
          test -n "$THUHA_WP_USER"
          test -n "$THUHA_WP_APPLICATION_PASSWORD"
      - name: Authenticate to WordPress publisher API and record verified adapter
        run: python3 -m thuha.cli --remote adapter-preflight
      - name: Read authenticated language-aware inventory without publishing
        run: python3 -m thuha.cli --remote --output artifacts/live-audit audit
      - name: Summarize verification without exposing credentials
        run: echo 'WordPress adapter authenticated; inventory read finished. No posts were written.'
