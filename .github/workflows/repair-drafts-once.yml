name: One-time synchronize stored draft exports
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repair-drafts-once.yml'
permissions:
  contents: write
concurrency:
  group: thuha-one-time-export-repair
  cancel-in-progress: false
jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Regenerate deterministic drafts from immutable session ledger
        run: python3 scripts/export_drafts.py
      - name: Verify exports without lowering any QA thresholds
        run: python3 -m unittest discover -s tests -p test_waiting_data.py -v
      - name: Commit ONLY derived draft exports (fail on branch drift)
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git status --porcelain | grep -v -E '^.. drafts/'; then
            echo "Unexpected non-draft file changes" >&2
            exit 1
          fi
          git add -A -- drafts/
          if git diff --cached --quiet; then
            echo "Draft exports already current"
            exit 0
          fi
          git commit -m "fix: synchronize committed drafts with session ledger"
          git push origin HEAD:main
