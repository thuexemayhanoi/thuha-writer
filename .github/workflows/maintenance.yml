name: ThuHa coordinator and maintenance
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
    inputs:
      task:
        type: choice
        default: health
        options: [health, report, audit, coordinator, refill, intake, qa, repair, recovery, promote]
      intake_file:
        type: string
        default: ''
permissions:
  contents: read
  actions: read
concurrency:
  group: thuha-maintenance
  cancel-in-progress: false
jobs:
  health:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || inputs.task == 'health' || inputs.task == 'report')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      PYTHONPATH: src
      THUHA_GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - run: python3 -m thuha.cli --remote --output artifacts health
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: factory-health-${{ github.run_id }}
          path: artifacts/
          retention-days: 14
  state-operation:
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.task != 'health' && inputs.task != 'report'
    permissions:
      contents: write
      actions: read
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      PYTHONPATH: src
      THUHA_GITHUB_TOKEN: ${{ github.token }}
      TASK: ${{ inputs.task }}
      INTAKE_FILE: ${{ inputs.intake_file }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Trusted main controller; external AI is never simulated
        shell: bash
        run: |
          set -euo pipefail
          case "$TASK" in
            audit) python3 -m thuha.cli --remote --output artifacts/live-audit audit ;;
            coordinator|recovery) python3 -m thuha.cli --remote "$TASK" ;;
            refill) python3 -m thuha.cli --remote refill ;;
            qa|repair) python3 -m thuha.cli --remote qa --pending ;;
            promote) python3 -m thuha.cli --remote promote --apply ;;
            intake)
              [[ "$INTAKE_FILE" =~ ^data/candidates/[a-zA-Z0-9_-]+\.json$ ]] || exit 1
              python3 -m thuha.cli --remote intake --file "$INTAKE_FILE"
              ;;
            *) exit 1 ;;
          esac
          python3 -m thuha.cli --remote --output artifacts report
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: factory-operation-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: ignore
          retention-days: 14
